name: Monitoraggio bandi di ricerca oncologica

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: monitoraggio-bandi-oncologici-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitoraggio:
    name: Controllo call oncologiche
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Mostra la versione di Python
        run: python --version

      - name: Aggiorna pip
        run: python -m pip install --upgrade pip

      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt

      - name: Esegue il monitoraggio oncologico EP PerMed
        run: python src/monitor.py

      - name: Esegue il monitoraggio EU Mission on Cancer
        run: python src/monitor_cancer_mission.py

      - name: Esegue il monitoraggio Ricerca Finalizzata
        run: python src/monitor_ricerca_finalizzata.py

      - name: Verifica i file JSON generati
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "data/ep_permed_calls.json"
            "data/eu_mission_cancer_calls.json"
            "data/ricerca_finalizzata_calls.json"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Errore: il file $file non è stato creato."
              exit 1
            fi

            python -m json.tool "$file" > /dev/null

            echo "File presente e valido: $file"
          done

          echo "Tutti i file JSON sono presenti e validi."

      - name: Mostra il riepilogo complessivo
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/ep_permed_calls.json"),
              Path("data/eu_mission_cancer_calls.json"),
              Path("data/ricerca_finalizzata_calls.json"),
          ]

          print("=" * 70)
          print("RIEPILOGO COMPLESSIVO DEL MONITORAGGIO")
          print("=" * 70)

          totale = 0

          for file_path in files:
              with file_path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  data = json.load(file)

              fonte = data.get(
                  "fonte",
                  file_path.name,
              )

              calls = data.get(
                  "calls",
                  [],
              )

              numero_risultati = data.get(
                  "numero_risultati",
                  len(calls),
              )

              totale += numero_risultati

              print()
              print("-" * 70)
              print(f"Fonte: {fonte}")
              print(f"File: {file_path}")
              print(f"Risultati attivi: {numero_risultati}")

              if not calls:
                  print("Nessuna call attiva rilevata.")
                  continue

              for numero, call in enumerate(
                  calls,
                  start=1,
              ):
                  codice = call.get(
                      "codice_topic",
                      "",
                  )

                  titolo = call.get(
                      "titolo",
                      "Titolo non disponibile",
                  )

                  url = call.get(
                      "url",
                      "URL non disponibile",
                  )

                  deadline = call.get(
                      "deadline",
                      "Deadline non disponibile",
                  )

                  if codice:
                      print(
                          f"{numero}. {codice} - {titolo}"
                      )
                  else:
                      print(
                          f"{numero}. {titolo}"
                      )

                  print(f"   URL: {url}")
                  print(f"   Deadline: {deadline}")

          print()
          print("=" * 70)
          print(
              "Totale opportunità attive "
              f"nelle tre fonti: {totale}"
          )
          print("=" * 70)
          PY

      - name: Configura Git
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Registra gli eventuali aggiornamenti
        shell: bash
        run: |
          set -euo pipefail

          git add data/ep_permed_calls.json
          git add data/eu_mission_cancer_calls.json
          git add data/ricerca_finalizzata_calls.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da registrare."
            exit 0
          fi

          echo "Sono state rilevate modifiche nei risultati."
          echo
          echo "Riepilogo delle modifiche:"
          git diff --cached --stat

          git commit \
            -m "Aggiorna monitoraggio call oncologiche"

          git pull \
            --rebase \
            origin \
            "${GITHUB_REF_NAME}"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

          echo
          echo "Aggiornamenti salvati correttamente nel repository."
