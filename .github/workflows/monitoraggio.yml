name: Monitoraggio bandi di ricerca oncologica

on:
  workflow_dispatch:
  
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: monitoraggio-bandi-oncologici-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitoraggio:
    name: Controllo call oncologiche
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Mostra la versione di Python
        run: python --version

      - name: Aggiorna pip
        run: python -m pip install --upgrade pip

      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt

      - name: Verifica la sintassi degli script Python
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile src/monitor.py
          python -m py_compile src/monitor_cancer_mission.py
          python -m py_compile src/monitor_ricerca_finalizzata.py
          python -m py_compile src/monitor_worldwide_cancer_research.py
          python -m py_compile src/monitor_era4health.py
          python -m py_compile src/monitor_fondazione_veronesi.py
          python -m py_compile src/monitor_airc.py

          echo "La sintassi di tutti gli script Python e valida."

      - name: Esegue il monitoraggio oncologico EP PerMed
        run: python src/monitor.py

      - name: Esegue il monitoraggio EU Mission on Cancer
        run: python src/monitor_cancer_mission.py

      - name: Esegue il monitoraggio Ricerca Finalizzata
        id: ricerca_finalizzata
        continue-on-error: true
        run: python src/monitor_ricerca_finalizzata.py

      - name: Segnala lo stato della Ricerca Finalizzata
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.ricerca_finalizzata.outcome }}" = "success" ]; then
            echo "Monitoraggio Ricerca Finalizzata completato."
          else
            echo "Avviso: monitoraggio Ricerca Finalizzata non completato."
            echo "Gli altri monitor continueranno normalmente."
          fi

      - name: Esegue il monitoraggio Worldwide Cancer Research
        id: worldwide_cancer_research
        continue-on-error: true
        run: python src/monitor_worldwide_cancer_research.py

      - name: Segnala lo stato di Worldwide Cancer Research
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.worldwide_cancer_research.outcome }}" = "success" ]; then
            echo "Monitoraggio Worldwide Cancer Research completato."
          else
            echo "Avviso: monitoraggio Worldwide Cancer Research non completato."
            echo "Gli altri monitor continueranno normalmente."
          fi

      - name: Esegue il monitoraggio ERA4Health
        id: era4health
        continue-on-error: true
        run: python src/monitor_era4health.py

      - name: Segnala lo stato di ERA4Health
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.era4health.outcome }}" = "success" ]; then
            echo "Monitoraggio ERA4Health completato."
          else
            echo "Avviso: monitoraggio ERA4Health non completato."
            echo "L'archivio precedente, se presente, non viene sovrascritto."
            echo "Gli altri monitor continueranno normalmente."
          fi

      - name: Esegue il monitoraggio Fondazione Umberto Veronesi
        id: fondazione_veronesi
        continue-on-error: true
        run: python src/monitor_fondazione_veronesi.py

      - name: Segnala lo stato della Fondazione Umberto Veronesi
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.fondazione_veronesi.outcome }}" = "success" ]; then
            echo "Monitoraggio Fondazione Umberto Veronesi completato."
          else
            echo "Avviso: monitoraggio Fondazione Umberto Veronesi non completato."
            echo "L'archivio precedente, se presente, non viene sovrascritto."
            echo "Gli altri monitor continueranno normalmente."
          fi

      - name: Esegue il monitoraggio AIRC
        id: airc
        continue-on-error: true
        run: python src/monitor_airc.py

      - name: Segnala lo stato di AIRC
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.airc.outcome }}" = "success" ]; then
            echo "Monitoraggio AIRC completato."
          else
            echo "Avviso: monitoraggio AIRC non completato."
            echo "L'archivio precedente, se presente, non viene sovrascritto."
            echo "Gli altri monitor continueranno normalmente."
          fi

      - name: Verifica i file JSON obbligatori
        shell: bash
        run: |
          set -euo pipefail

          files_obbligatori=(
            "data/ep_permed_calls.json"
            "data/eu_mission_cancer_calls.json"
          )

          for file in "${files_obbligatori[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Errore: il file $file non e stato creato."
              exit 1
            fi

            python -m json.tool "$file" > /dev/null
            echo "File obbligatorio presente e valido: $file"
          done

          echo "I file JSON obbligatori sono validi."

      - name: Verifica archivio Ricerca Finalizzata
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          file="data/ricerca_finalizzata_calls.json"

          if [ -f "$file" ]; then
            python -m json.tool "$file" > /dev/null
            echo "Archivio Ricerca Finalizzata presente e valido."
          else
            echo "Archivio Ricerca Finalizzata non ancora disponibile."
            echo "Questo non interrompe il workflow."
          fi

      - name: Verifica archivio Worldwide Cancer Research
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          file="data/worldwide_cancer_research_calls.json"

          if [ -f "$file" ]; then
            python -m json.tool "$file" > /dev/null
            echo "Archivio Worldwide Cancer Research presente e valido."
          else
            echo "Archivio Worldwide Cancer Research non ancora disponibile."
            echo "Questo non interrompe il workflow."
          fi

      - name: Verifica archivio ERA4Health
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          file="data/era4health_calls.json"

          if [ -f "$file" ]; then
            python -m json.tool "$file" > /dev/null
            echo "Archivio ERA4Health presente e valido."
          else
            echo "Archivio ERA4Health non ancora disponibile."
            echo "Questo non interrompe il workflow."
          fi

      - name: Verifica archivio Fondazione Umberto Veronesi
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          file="data/fondazione_veronesi_calls.json"

          if [ -f "$file" ]; then
            python -m json.tool "$file" > /dev/null
            echo "Archivio Fondazione Umberto Veronesi presente e valido."
          else
            echo "Archivio Fondazione Umberto Veronesi non ancora disponibile."
            echo "Questo non interrompe il workflow."
          fi

      - name: Verifica archivio AIRC
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          file="data/airc_calls.json"

          if [ -f "$file" ]; then
            python -m json.tool "$file" > /dev/null
            echo "Archivio AIRC presente e valido."
          else
            echo "Archivio AIRC non ancora disponibile."
            echo "Questo non interrompe il workflow."
          fi

      - name: Mostra il riepilogo complessivo
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/ep_permed_calls.json"),
              Path("data/eu_mission_cancer_calls.json"),
              Path("data/ricerca_finalizzata_calls.json"),
              Path("data/worldwide_cancer_research_calls.json"),
              Path("data/era4health_calls.json"),
              Path("data/fondazione_veronesi_calls.json"),
              Path("data/airc_calls.json"),
          ]

          print("=" * 70)
          print("RIEPILOGO COMPLESSIVO DEL MONITORAGGIO")
          print("=" * 70)

          totale = 0

          for file_path in files:
              print()
              print("-" * 70)

              if not file_path.exists():
                  print(f"File non disponibile: {file_path}")
                  continue

              with file_path.open("r", encoding="utf-8") as file:
                  data = json.load(file)

              fonte = data.get("fonte", file_path.name)
              calls = data.get("calls", [])
              numero_risultati = data.get("numero_risultati", len(calls))
              totale += numero_risultati

              print(f"Fonte: {fonte}")
              print(f"File: {file_path}")
              print(f"Risultati attivi: {numero_risultati}")

              stato_indice = data.get("stato_indice")
              stato_round = data.get("stato_round")
              stato_submission = data.get("stato_submission")
              canale = data.get("canale_utilizzato")
              deadline_generale = data.get("deadline")

              if stato_indice is not None:
                  print(f"Stato indice: {stato_indice}")

              if canale is not None:
                  print(f"Canale utilizzato: {canale}")

              if stato_round is not None:
                  print(f"Stato round: {stato_round}")

              if stato_submission is not None:
                  print(f"Stato submission: {stato_submission}")

              if deadline_generale is not None:
                  print(f"Deadline generale: {deadline_generale}")

              if not calls:
                  print("Nessuna call attiva archiviata.")
                  continue

              for numero, call in enumerate(calls, start=1):
                  codice = call.get("codice_topic", "")
                  titolo = call.get("titolo", "Titolo non disponibile")
                  url = call.get("url", "URL non disponibile")
                  deadline = call.get("deadline", "Deadline non disponibile")

                  if codice:
                      print(f"{numero}. {codice} - {titolo}")
                  else:
                      print(f"{numero}. {titolo}")

                  print(f"   URL: {url}")
                  print(f"   Deadline: {deadline}")

          print()
          print("=" * 70)
          print(f"Totale opportunita attive negli archivi: {totale}")
          print("=" * 70)
          PY

      - name: Configura Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Registra gli eventuali aggiornamenti
        shell: bash
        run: |
          set -euo pipefail

          git add data/ep_permed_calls.json
          git add data/eu_mission_cancer_calls.json

          if [ -f "data/ricerca_finalizzata_calls.json" ]; then
            git add data/ricerca_finalizzata_calls.json
          fi

          if [ -f "data/worldwide_cancer_research_calls.json" ]; then
            git add data/worldwide_cancer_research_calls.json
          fi

          if [ -f "data/era4health_calls.json" ]; then
            git add data/era4health_calls.json
          fi

          if [ -f "data/fondazione_veronesi_calls.json" ]; then
            git add data/fondazione_veronesi_calls.json
          fi

          if [ -f "data/airc_calls.json" ]; then
            git add data/airc_calls.json
          fi

          if git diff --cached --quiet; then
            echo "Nessuna modifica da registrare."
            exit 0
          fi

          echo "Sono state rilevate modifiche nei risultati."
          echo
          echo "Riepilogo delle modifiche:"
          git diff --cached --stat

          git commit -m "Aggiorna monitoraggio call oncologiche"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo
          echo "Aggiornamenti salvati correttamente nel repository."

      - name: Crea il report email programmato
        if: ${{ always() && github.event_name == 'schedule' }}
        shell: bash
        env:
          STATO_RICERCA_FINALIZZATA: ${{ steps.ricerca_finalizzata.outcome }}
          STATO_WORLDWIDE_CANCER_RESEARCH: ${{ steps.worldwide_cancer_research.outcome }}
          STATO_ERA4HEALTH: ${{ steps.era4health.outcome }}
          STATO_FONDAZIONE_VERONESI: ${{ steps.fondazione_veronesi.outcome }}
          STATO_AIRC: ${{ steps.airc.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_NAME: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import html
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          fonti = [
              {
                  "nome": "EP PerMed",
                  "file": Path("data/ep_permed_calls.json"),
                  "stato_step": "success",
              },
              {
                  "nome": "EU Mission on Cancer",
                  "file": Path("data/eu_mission_cancer_calls.json"),
                  "stato_step": "success",
              },
              {
                  "nome": "Ricerca Finalizzata",
                  "file": Path("data/ricerca_finalizzata_calls.json"),
                  "stato_step": os.environ.get(
                      "STATO_RICERCA_FINALIZZATA",
                      "non disponibile",
                  ),
              },
              {
                  "nome": "Worldwide Cancer Research",
                  "file": Path("data/worldwide_cancer_research_calls.json"),
                  "stato_step": os.environ.get(
                      "STATO_WORLDWIDE_CANCER_RESEARCH",
                      "non disponibile",
                  ),
              },
              {
                  "nome": "ERA4Health",
                  "file": Path("data/era4health_calls.json"),
                  "stato_step": os.environ.get(
                      "STATO_ERA4HEALTH",
                      "non disponibile",
                  ),
              },
              {
                  "nome": "Fondazione Umberto Veronesi",
                  "file": Path("data/fondazione_veronesi_calls.json"),
                  "stato_step": os.environ.get(
                      "STATO_FONDAZIONE_VERONESI",
                      "non disponibile",
                  ),
              },
              {
                  "nome": "AIRC",
                  "file": Path("data/airc_calls.json"),
                  "stato_step": os.environ.get(
                      "STATO_AIRC",
                      "non disponibile",
                  ),
              },
          ]

          righe_tabella = []
          dettaglio_calls = []
          totale_attive = 0
          fonti_con_avvisi = 0

          for fonte in fonti:
              file_path = fonte["file"]
              stato_step = fonte["stato_step"]
              dati = None
              errore = None

              if file_path.exists():
                  try:
                      with file_path.open("r", encoding="utf-8") as file:
                          dati = json.load(file)
                  except (OSError, json.JSONDecodeError) as exc:
                      errore = f"Archivio non leggibile: {exc}"
              else:
                  errore = "Archivio non disponibile"

              if dati is not None:
                  calls = dati.get("calls", [])
                  numero = dati.get("numero_risultati", len(calls))
                  stato_fonte = (
                      dati.get("stato_indice")
                      or dati.get("stato_submission")
                      or dati.get("stato_round")
                      or dati.get("canale_utilizzato")
                      or "controllo completato"
                  )
              else:
                  calls = []
                  numero = 0
                  stato_fonte = errore or "non disponibile"

              totale_attive += numero

              if stato_step not in {"success", "skipped"}:
                  stato_visuale = f"Avviso: {stato_step}"
                  colore = "#b45309"
                  fonti_con_avvisi += 1
              elif errore:
                  stato_visuale = errore
                  colore = "#b45309"
                  fonti_con_avvisi += 1
              else:
                  stato_visuale = stato_fonte
                  colore = "#166534"

              righe_tabella.append(
                  "<tr>"
                  f"<td>{html.escape(fonte['nome'])}</td>"
                  f"<td style='text-align:center'><strong>{numero}</strong></td>"
                  f"<td style='color:{colore}'>{html.escape(str(stato_visuale))}</td>"
                  "</tr>"
              )

              for call in calls:
                  titolo = html.escape(
                      str(call.get("titolo", "Titolo non disponibile"))
                  )
                  url = html.escape(str(call.get("url", "")), quote=True)
                  deadline = html.escape(
                      str(call.get("deadline", "Deadline non disponibile"))
                  )

                  if url:
                      titolo_html = f"<a href='{url}'>{titolo}</a>"
                  else:
                      titolo_html = titolo

                  dettaglio_calls.append(
                      "<li>"
                      f"<strong>{html.escape(fonte['nome'])}</strong>: "
                      f"{titolo_html}<br>"
                      f"Deadline: {deadline}"
                      "</li>"
                  )

          data_utc = datetime.now(timezone.utc).strftime(
              "%d/%m/%Y alle %H:%M UTC"
          )
          run_url = html.escape(os.environ["RUN_URL"], quote=True)
          repository = html.escape(os.environ["REPOSITORY_NAME"])
          run_number = html.escape(os.environ["RUN_NUMBER"])

          if dettaglio_calls:
              elenco_calls = "<ul>" + "".join(dettaglio_calls) + "</ul>"
          else:
              elenco_calls = "<p>Nessuna opportunità attiva archiviata.</p>"

          report = f"""<!doctype html>
          <html lang='it'>
          <head>
            <meta charset='utf-8'>
          </head>
          <body style='font-family:Arial,sans-serif;color:#1f2937;line-height:1.5'>
            <h2>Report monitoraggio call oncologiche</h2>
            <p>
              Repository: <strong>{repository}</strong><br>
              Esecuzione: <strong>#{run_number}</strong><br>
              Data report: <strong>{data_utc}</strong>
            </p>

            <p style='font-size:18px'>
              Totale opportunità attive: <strong>{totale_attive}</strong><br>
              Fonti con avvisi tecnici: <strong>{fonti_con_avvisi}</strong>
            </p>

            <table style='border-collapse:collapse;width:100%;max-width:900px'>
              <thead>
                <tr style='background:#e5e7eb'>
                  <th style='border:1px solid #d1d5db;padding:8px;text-align:left'>Fonte</th>
                  <th style='border:1px solid #d1d5db;padding:8px'>Call attive</th>
                  <th style='border:1px solid #d1d5db;padding:8px;text-align:left'>Stato</th>
                </tr>
              </thead>
              <tbody>
                {''.join(righe_tabella)}
              </tbody>
            </table>

            <h3>Opportunità attive</h3>
            {elenco_calls}

            <p>
              <a href='{run_url}'>Apri l'esecuzione completa su GitHub Actions</a>
            </p>

            <p style='font-size:12px;color:#6b7280'>
              Report generato automaticamente dopo l'esecuzione programmata.
              Le fonti indirette o non completamente verificabili sono indicate nello stato.
            </p>
          </body>
          </html>
          """

          Path("report-email.html").write_text(
              report,
              encoding="utf-8",
          )

          print(
              "Report email creato: "
              f"{totale_attive} opportunita attive, "
              f"{fonti_con_avvisi} fonti con avvisi."
          )
          PY

      - name: Invia il report email programmato
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Report call oncologiche - esecuzione #${{ github.run_number }}"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          html_body: file://report-email.html

