name: Test manuale invio email da monitoraggio progetti scientifici

on:
  workflow_dispatch:

  schedule:
  - cron: "17 */6 * * *"

jobs:
  test-email:
    name: Test invio report email
    runs-on: ubuntu-latest

    steps:
      - name: Mostra informazioni esecuzione
        shell: bash
        run: |
          set -euo pipefail

          echo "Avvio del test email"
          echo "Repository: ${{ github.repository }}"
          echo "Tipo di avvio: ${{ github.event_name }}"
          echo "Numero esecuzione: ${{ github.run_number }}"
          echo "Data UTC: $(date -u)"

      - name: Invia email di test
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Test email monitoraggio call oncologiche"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          body: |
            Il test di invio email è stato completato.

            Repository: ${{ github.repository }}
            Tipo di avvio: ${{ github.event_name }}
            Numero esecuzione: ${{ github.run_number }}

            Pagina dell'esecuzione:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Se hai ricevuto questa email, l'invio SMTP dal repository funziona.
